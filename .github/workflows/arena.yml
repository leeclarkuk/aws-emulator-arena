name: Arena

on:
  push:
    branches: [main]
    paths-ignore:
      - "scoreboard/**"
  pull_request:
  schedule:
    # Hourly, seven minutes past. History is appended on main only when results change.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the arena
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Reject em dashes in tracked text
        run: python -m pytest -q tests/test_no_emdash.py

      - name: Install AWS Emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          bash scripts/install-emulator.sh

      - name: Run the arena
        run: bash scripts/run.sh

      - uses: actions/upload-artifact@v4
        with:
          name: scoreboard
          path: |
            site/
            scoreboard/latest.json
            scoreboard/history.json
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Record this run in scoreboard history
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoreboard/latest.json scoreboard/history.json
          git diff --cached --quiet && exit 0
          version="$(python -c 'import json; print(json.load(open("scoreboard/latest.json"))["emulator"]["version"])')"
          git commit -m "scoreboard: emulator ${version}"
          git push

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy scoreboard
        id: deployment
        uses: actions/deploy-pages@v4
